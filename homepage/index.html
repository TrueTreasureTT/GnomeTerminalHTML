<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gnome Terminal Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030508;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
            padding: 40px 0;
        }

        /* Animated Starry Background */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Content Container */
        .content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            width: 100%;
        }

        /* Intense Glowing Title */
        .glowing-title {
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            margin-top: 20px;
            text-shadow: 
                0 0 5px #00ff22,
                0 0 10px #00ff22,
                0 0 20px #00ff22,
                0 0 40px #00ff22,
                0 0 80px #00ff22,
                0 0 100px #00ff22;
        }

        /* Center Logo with Blur */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            max-width: 320px;
            height: auto;
            filter: blur(4px);
            border-radius: 12px;
        }

        /* Pill Buttons with Falling Animation */
        .button-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .pill-btn {
            background-color: #c8ffc8;
            color: #0b3d0b;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 12px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 0 10px #00ff22,
                0 0 20px #00ff22,
                0 0 40px #00ff22,
                inset 0 0 10px #00ff22;
            transition: transform 0.2s, box-shadow 0.2s;

            /* Falling animation */
            animation: dropIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(-150px);
        }

        /* Staggered falling delays */
        .pill-btn:nth-child(1) { animation-delay: 0.1s; }
        .pill-btn:nth-child(2) { animation-delay: 0.3s; }
        .pill-btn:nth-child(3) { animation-delay: 0.5s; }

        .pill-btn:hover {
            transform: scale(1.08);
            box-shadow: 
                0 0 15px #00ff22,
                0 0 30px #00ff22,
                0 0 60px #00ff22,
                inset 0 0 15px #00ff22;
        }

        @keyframes dropIn {
            0% {
                opacity: 0;
                transform: translateY(-150px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Dynamic Animated Starfield Background -->
    <div class="stars-container" id="stars"></div>

    <div class="content">
        <!-- Glowing Header Text -->
        <h1 class="glowing-title">Gnome Terminal online</h1>

        <!-- Blurry Logo -->
        <div class="logo-container">
            <img src="logo.png" alt="Gnome Terminal Logo">
        </div>

        <!-- Glowing Pill Buttons with Fall Animation -->
        <div class="button-group">
            <button class="pill-btn">START</button>
            <button class="pill-btn">SETTINGS</button>
            <button class="pill-btn">HELP</button>
        </div>
    </div>

    <script>
        // Generate random animated stars
        const starsContainer = document.getElementById('stars');
        const starCount = 150;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            const size = Math.random() * 3 + 1;
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            const opacity = Math.random() * 0.7 + 0.3;

            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${posX}%`;
            star.style.top = `${posY}%`;
            star.style.setProperty('--duration', `${duration}s`);
            star.style.setProperty('--opacity', opacity);

            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
